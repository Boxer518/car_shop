name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib test
      - name: Собрать веб-клиент
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -eu
          args="--release --base-href /${GITHUB_REPOSITORY##*/}/"
          if [ -n "$API_BASE_URL" ]; then
            args="$args --dart-define=API_BASE_URL=$API_BASE_URL"
          fi
          flutter build web $args
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
